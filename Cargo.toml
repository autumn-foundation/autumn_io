[package]
name = "autumn_io"
version = "0.1.0"
edition = "2024"

[dependencies]
# `db` is autumn-web's biggest default feature (diesel, diesel-async,
# libsqlite3-sys, pq-sys, tokio-postgres, rustls, ...): this site has no
# database, no models, and no repository usage anywhere in `src/`. Opting out
# of default features and listing only what's actually used — `maud` (Maud
# templates), `htmx` (the `HxRequest` extractor and `HTMX_JS_PATH` asset in
# the docs search widget), `markdown` (the guide-rendering pipeline in
# `docs.rs`), `mcp` (which pulls in `openapi`, used directly in `api.rs`), and
# `reporting` (the panic-isolating `ReportingLayer` — a production safety net,
# not just optional error-sink wiring, so it stays even though nothing here
# registers a custom `ErrorReporter`) — cuts both compile time and binary
# size. `cache-moka`, `http-client`, `flash`, and `tailwind` (this app's own
# `build.rs` shells out to the Tailwind CLI directly; the Cargo feature gates
# no code at all) are dropped as unused.
autumn-web = { version = "0.7.0", default-features = false, features = [
    "maud",
    "htmx",
    "markdown",
    "mcp",
    "reporting",
] }
maud = "0.27.0"
memchr = "2.8.0"
pulldown-cmark = "0.13.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Oniguruma (`default-onig`) is syntect's own upstream default and the engine
# TextMate grammars are written against. Under the pure-Rust `default-fancy`
# alternative, the regex bucket was 76.81% of the cold-start docs render and
# `fancy_regex`'s backtracking VM alone was 42.24% of it (issue #19); switching
# cut the whole render from 13.75B instructions to 3.61B. `onig_sys` compiles
# bundled C, so the builder image needs a C toolchain — see the Dockerfile.
syntect = { version = "5.3.0", default-features = false, features = ["default-onig"] }
tower = "0.5"
tower-http = { version = "0.6.10", features = ["compression-gzip", "map-response-body"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }

[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
debug = false

# The deployed binary is stripped, and the performance work in this repo is not:
# callgrind attributes by symbol, and every figure quoted in `docs/plans/` and in
# the `src/bin/profile_docs_*.rs` headers was taken that way. This profile is the
# release build with the symbol table and debug info put back, so a measurement
# is of the binary that ships rather than of a differently-optimised one:
#
#   cargo build --profile profiling --bin profile_docs_render
#   valgrind --tool=callgrind ./target/profiling/profile_docs_render
#
# `tests/fly_deploy_config.rs` guards the three lines that make that true.
[profile.profiling]
inherits = "release"
strip = "none"
panic = "unwind"
debug = true
