[package]
name = "autumn_io"
version = "0.1.0"
edition = "2024"

[dependencies]
# Shared by both lanes. Everything here compiles for `wasm32-wasip1` as well as
# for the host, because `src/edge.rs` and the render pipeline it pulls in
# (`docs`, `site`, `seo`, `frontmatter`, `widgets`) are compiled into the edge
# capsule. See `content/guide/edge.md` and `docs/adr/0001-cloudflare-edge-capsule.md`.
autumn-edge = "0.7.0"
maud = { version = "0.27.0", features = ["axum"] }
memchr = "2.8.0"
pulldown-cmark = "0.13.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Guide frontmatter. This was `autumn_web::markdown::MarkdownRegistry` until the
# edge lane arrived; `src/frontmatter.rs` is a port of it, because the registry
# is on the read path both lanes serve and `autumn-web` is not in the capsule's
# dependency graph. `tests/frontmatter_parity.rs` pins the port natively.
toml = "1.1"

# ── origin only ──────────────────────────────────────────────────────
#
# `db` is autumn-web's biggest default feature (diesel, diesel-async,
# libsqlite3-sys, pq-sys, tokio-postgres, rustls, ...): this site has no
# database, no models, and no repository usage anywhere in `src/`. Opting out
# of default features and listing only what's actually used — `maud` (Maud
# templates), `htmx` (the `HxRequest` extractor in `origin.rs`), `mcp` (which
# pulls in `openapi`, used directly in `api.rs`), `reporting` (the
# panic-isolating `ReportingLayer` — a production safety net, not just optional
# error-sink wiring, so it stays even though nothing here registers a custom
# `ErrorReporter`), and `edge` (the origin half of the edge lane) — cuts both
# compile time and binary size. `cache-moka`, `http-client`, `flash`, and
# `tailwind` (this app's own `build.rs` shells out to the Tailwind CLI directly;
# the Cargo feature gates no code at all) are dropped as unused.
#
# `markdown` is gone with `MarkdownRegistry`: nothing in `src/` calls the
# framework's Markdown pipeline any more, and dropping it takes `ammonia` and a
# second `pulldown-cmark` configuration out of the origin build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
autumn-web = { version = "0.7.0", default-features = false, features = [
    "maud",
    "htmx",
    "mcp",
    "reporting",
    "edge",
] }
# Oniguruma (`default-onig`) is syntect's own upstream default and the engine
# TextMate grammars are written against. Under the pure-Rust `default-fancy`
# alternative, the regex bucket was 76.81% of the cold-start docs render and
# `fancy_regex`'s backtracking VM alone was 42.24% of it (issue #19); switching
# cut the whole render from 13.75B instructions to 3.61B. `onig_sys` compiles
# bundled C, so the builder image needs a C toolchain — see the Dockerfile.
syntect = { version = "5.3.0", default-features = false, features = ["default-onig"] }
tower = "0.5"
tower-http = { version = "0.6.10", features = ["compression-gzip", "map-response-body"] }

# ── capsule only ─────────────────────────────────────────────────────
#
# `onig_sys` builds bundled C, which needs a `wasm32-wasip1` sysroot no ordinary
# Rust toolchain ships, so the capsule uses syntect's pure-Rust engine instead.
# That is only sound because the two engines produce the *same bytes*: every one
# of the 140 bundled guides renders identically under both, and
# `tests/edge_conformance.rs` re-checks it on every build by comparing what the
# two lanes serve. The instruction-count argument above does not apply here —
# the capsule renders one page per request, not the whole corpus.
[target.'cfg(target_arch = "wasm32")'.dependencies]
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }

# `tests/port_parity.rs` checks `src/frontmatter.rs` and `src/widgets.rs`
# against the `autumn-web` pieces they were ported from, so the test build —
# and only the test build — needs the framework's Markdown registry back.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
autumn-web = { version = "0.7.0", default-features = false, features = [
    "maud",
    "htmx",
    "markdown",
    "mcp",
    "reporting",
    "edge",
] }

[workspace]

# This binary is built once per deploy and then serves until the next one, so
# the profile spends build time freely and optimises for what runs. Numbers
# below are callgrind instruction counts on aarch64-linux, taken through the
# harnesses in `src/bin/` the same way issues #19 and #23 took theirs; see
# `docs/plans/2026-09-04-release-profile-and-ci.md`.
[profile.release]
# Not "s", and emphatically not "z". Measured against this corpus:
#
#                    search (marginal/req)   cold-start render
#   opt-level = 3          2,171,562           3,395,498,611
#   opt-level = "s"        2,135,722  (-1.7%)  3,767,464,464  (+11.0%)
#   opt-level = "z"        2,404,462 (+10.7%)  4,302,839,402  (+26.7%)
#
# The size levels look defensible on the marginal search path — "s" is a wash
# there — and then cost 11% and 27% of the cold-start render. That render is
# not a rare path for this app: `fly.toml` sets `min_machines_running = 0` with
# `auto_stop_machines`, so the first request after a scale-to-zero pays it in
# full, and it is the one a real visitor is most likely to wait on.
opt-level = 3

# Whole-program optimisation across the dependency graph, in one codegen unit
# so nothing is left on the table at the boundaries. Together these are where
# the binary's size win is: 36,580,752 -> 27,601,240 bytes, -24.5%, at the same
# opt-level — nearly four times what dropping to "s" would save from here, and
# free at runtime. They cost the build about a minute.
#
# The obvious worry is the builder, which the Dockerfile sizes at 8 GB after an
# OOM. It is not a problem: the fat-LTO link peaks at 3909 MB, *below* the
# 4401 MB peak of compiling `autumn-web`, so the ceiling is unchanged and still
# lives in rustc's front end. The Dockerfile records this.
lto = "fat"
codegen-units = 1

# Explicit because the tempting value is wrong here. Autumn uses unwinding as a
# correctness mechanism, not just for diagnostics: `autumn-web`'s `db.rs`
# catches panics inside a transaction because one that unwound without a
# rollback would let deadpool recycle a connection with an open write
# transaction, and the job runner and event dispatcher isolate a panicking
# handler from its siblings the same way. Under `panic = "abort"` each of those
# isolation boundaries becomes a process kill.
panic = "unwind"

# Deliberately no `strip`. `src/bin/profile_docs_search.rs` says why in prose —
# callgrind attributes by symbol, and this repo's performance work depends on
# that — and stripping also turns production panic backtraces into addresses.
# `strip = "debuginfo"` is not a compromise: release builds carry none to start
# with, so it would remove nothing.
