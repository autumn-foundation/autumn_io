# fly.toml app configuration file generated for autumn-io on 2026-05-18T17:48:48Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'autumn-io'
primary_region = 'ord'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# Lets Fly's built-in Prometheus scrape autumn-web's own
# `/actuator/prometheus` endpoint (on by default; see `[actuator]` in
# autumn.toml) into `https://api.fly.io/prometheus/<org-slug>`. No separate
# exporter or port needed — the scrape target is the app's normal HTTP port.
# This is what the `fly-autoscaler/` companion app queries; see its README.
[metrics]
  port = 3000
  path = "/actuator/prometheus"

[[vm]]
  # `memory` and `memory_mb` were both set, with different values. flyctl
  # resolves that in `computeToGuest`: it sets the guest's memory from `memory`,
  # then copies the inlined MachineGuest — which is where `memory_mb` lands —
  # over it with IgnoreEmpty, so a non-zero `memory_mb` wins. The machine has
  # therefore always been 256 MB, not the 1 GB the other line implied.
  #
  # Collapsed onto `memory`, the documented key, keeping the size unchanged.
  # `memory_mb` is undocumented legacy; raising this to '1gb' would be a real
  # 4x resize, not a cleanup.
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
