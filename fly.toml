# fly.toml app configuration file generated for autumn-io on 2026-05-18T17:48:48Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'autumn-io'
primary_region = 'ord'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# No Fly `[metrics]` block, on purpose. Fly's scraper reaches the machine by
# its private IP, so the request's Host is an IP literal, and the prod
# profile's `[security.trusted_hosts]` (autumn.toml) answers that with
# `400 Invalid Host header` — `/actuator/prometheus` is not on autumn-web's
# probe bypass list. A scrape block here only logs a "trusted host rejected
# request" warning every 15s and stores nothing.
#
# The `fly-autoscaler/` companion app does not need it: it queries
# fly-proxy's own `fly_edge_http_responses_count`, which Fly publishes for
# every HTTP app without scraping it. See fly-autoscaler/README.md.

[[vm]]
  # `memory` and `memory_mb` were both set, with different values. flyctl
  # resolves that in `computeToGuest`: it sets the guest's memory from `memory`,
  # then copies the inlined MachineGuest — which is where `memory_mb` lands —
  # over it with IgnoreEmpty, so a non-zero `memory_mb` wins. The machine has
  # therefore always been 256 MB, not the 1 GB the other line implied.
  #
  # Collapsed onto `memory`, the documented key, keeping the size unchanged.
  # `memory_mb` is undocumented legacy; raising this to '1gb' would be a real
  # 4x resize, not a cleanup.
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
