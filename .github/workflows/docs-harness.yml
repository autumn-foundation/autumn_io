name: Docs harness

# Runs the corpus's Tier-1 checks on every push and PR: link-fragment
# integrity, nav-group completeness (orphan guard), the vendored-guide
# route-shadow guard, and MCP retrieval shape (every guide fetchable, size
# gate correct, search functioning). Baseline at the commit that added this
# workflow: 62/62 passing (41 in docs_site, 21 in mcp_docs_api), 0 failures.
#
# Scoped to these two test binaries deliberately: neither needs a database
# or other service, so this job stays fast and has no infra to provision.
# It is not a substitute for the full test suite — just the part of it that
# is this corpus's regression gate.
on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  docs-tests:
    name: Docs corpus tests (link check, orphan guard, retrieval shape)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --test docs_site --test mcp_docs_api
