# Autumn configuration
# All values shown are defaults — uncomment and change as needed.

[server]
host = "127.0.0.1"
port = 3000
# shutdown_timeout_secs = 30

[profile.prod.server]
host = "0.0.0.0"

# Widget storybook (Autumn 0.6.0). Enabled in every profile — including prod —
# so the framework's built-in widget gallery is a public showcase at /_stories.
# This is safe for public exposure: stories are zero-arg pure functions that
# only ever render synthetic demo data defined inside their own blocks (no
# request data, no app state, no I/O). Registered on the builder via
# `.with_story_gallery(StoryGallery::builtin())` in src/main.rs.
[stories]
enabled = true

# Production hardening for Autumn 0.5.0's prod fail-fast.
# Under AUTUMN_PROFILE=prod the framework refuses to start unless BOTH a signing
# secret and a non-empty trusted-hosts allow-list are configured.
#
# The trusted-hosts list is non-secret and is committed here. The signing secret
# MUST NOT be committed — set it at runtime as a Fly secret:
#   fly secrets set AUTUMN_SECURITY__SIGNING_SECRET=$(openssl rand -hex 32) -a autumn-io
# (read from the AUTUMN_SECURITY__SIGNING_SECRET env var at startup).
#
# localhost/127.0.0.1/::1 are auto-trusted in non-prod profiles, so this list
# does not affect local development or the test harness.
[security.trusted_hosts]
hosts = ["autumn-web.app", "www.autumn-web.app", "autumn-io.fly.dev"]

# CSRF is disabled, deliberately, and this must stay explicit.
#
# Autumn's prod profile turns CSRF on as a smart default. The CSRF layer then
# issues `Set-Cookie: autumn-csrf=...` on any response whose request arrived
# without that cookie — which is every request Cloudflare makes to fill its
# cache, because a CDN does not send a browser's cookies on its own fetches.
#
# Cloudflare never stores a response carrying `Set-Cookie`. So with CSRF on,
# every page came back `cf-cache-status: BYPASS` and nothing on the read path
# could be cached, ever. That silently defeats the whole reason this site sends
# `s-maxage` (see docs/adr/0001-cache-the-docs-at-the-edge.md), and it is
# invisible from the browser: the pages look right, they are just always
# rendered by a scale-to-zero machine in `ord`.
#
# Turning it off costs nothing here, because there is nothing for a CSRF token
# to protect:
#
#   * No sessions and no authentication — `autumn-web` is compiled without the
#     `db` and session features, so none of that machinery is even present.
#   * Every route this app declares is a GET (`src/lib.rs`, `src/api.rs`).
#   * The one POST surface is the framework's `/mcp` mount, deliberately
#     unauthenticated public documentation exposing three read-only tools.
#
# CSRF defends authenticated state-changing requests. With no authentication
# and no state to change, a forged cross-site request can do exactly what any
# visitor can: read published documentation.
#
# `csrf_cookie_stays_disabled_so_the_read_path_can_be_cached` in
# `tests/fly_deploy_config.rs` pins this, because the failure mode is silent —
# re-enabling it breaks caching without breaking a page.
[security.csrf]
enabled = false

# Per-request CSP nonce in `script-src`, for Cloudflare's JavaScript Detections
# (https://developers.cloudflare.com/bots/additional-configurations/javascript-detections/).
# Cloudflare's bot-management JS injects an inline `<script>` into every
# response to run its browser fingerprinting; the framework default CSP ships
# `script-src 'self'` with no `'unsafe-inline'` and no nonce, so without a
# nonce that injected script is silently blocked by our own CSP.
# `/cdn-cgi/challenge-platform/` needs no separate allowance — it's served
# same-origin and already covered by `script-src 'self'`.
#
# `content_security_policy` is emptied here so the framework's own CSP
# emission is a no-op (see `autumn::security::headers`'s "escape hatch" doc
# comment) and `csp_nonce.enabled` is turned on purely so `SecurityHeadersLayer`
# mints a fresh nonce per request and threads it into the `CspNonce` extractor.
# `autumn_io::csp_nonce_layer()` (wired in `src/main.rs`) reads that nonce and
# emits the actual `Content-Security-Policy` header itself, adding the nonce to
# `script-src` only. That split — rather than the framework's own coupled
# default, which nonces `style-src` too and drops its `'unsafe-inline'` — is
# deliberate: this site's syntax-highlighted code blocks
# (`docs.rs::highlight_code`) emit `style="color:..."` on every token span, and
# a CSP nonce does not cover the `style` *attribute* (only `<style>` elements),
# so nonce-ing `style-src` would silently strip all syntax-highlighting color
# from every guide page. See the doc comment on `csp_nonce_layer` for the rest.
[security.headers]
content_security_policy = ""

[security.headers.csp_nonce]
enabled = true

[log]
level = "info"
# format = "Auto"  # Auto | Pretty | Json

[health]
path = "/health"
# live_path = "/live"
# ready_path = "/ready"
# startup_path = "/startup"

# Uncomment for OpenTelemetry / OTLP tracing:
# [telemetry]
# enabled = true
# service_name = "autumn_io"
# service_namespace = "apps"
# environment = "production"
# otlp_endpoint = "http://otel-collector:4317"
# protocol = "Grpc"  # Grpc | HttpProtobuf

# Uncomment to configure database:
# [database]
# url = "postgres://user:pass@localhost:5432/autumn_io"
# pool_size = 10
# connect_timeout_secs = 5  # pool wait/create timeout in seconds

# Uncomment to externalize sessions in production:
# [session]
# backend = "redis"
#
# [session.redis]
# url = "redis://redis:6379"
# key_prefix = "autumn_io:sessions"
