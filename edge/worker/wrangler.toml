# The Cloudflare Worker that fronts autumn-web.app with the docs edge capsule.
#
# Deploying is two steps, in this order:
#
#   ../build-capsule.sh          # cargo build --target wasm32-wasip1 --release
#   npx wrangler deploy
#
# The build script is not a `[build]` command on purpose: it needs the Rust
# toolchain and the `wasm32-wasip1` target, and having `wrangler deploy` fail
# three minutes in with a cargo error is worse than being told to run it first.

name = "autumn-io-edge"
main = "src/index.js"
compatibility_date = "2026-09-01"

# The capsule. `autumn build` writes it to
# `target/wasm32-wasip1/release/edge-capsule.wasm`; `build-capsule.sh` copies it
# here, because wrangler only bundles modules under the Worker's own directory.
#
# Note that this is a *program*, not an asset: it must never be published under
# `static/` or `dist/`, where it would be served to browsers instead of run.
[[rules]]
type = "CompiledWasm"
globs = ["build/*.wasm"]

[vars]
# Where a fallthrough goes. The origin serves every route the capsule serves,
# so this needs no path rewriting — the request arrives at a route that was
# always there.
ORIGIN = "https://autumn-io.fly.dev"

# The capsule declares no `needs(...)` capability, so no KV binding is required
# and none is configured. The shim supports one anyway: bind a namespace as
# `EDGE_KV` holding a JSON snapshot of key → base64 bytes under
# `EDGE_KV_SNAPSHOT_KEY` (default `edge-snapshot`), and the Worker will
# advertise the `kv` capability and answer `kv_get` from it. See
# `edge/README.md` § "The KV seam".
#
# [[kv_namespaces]]
# binding = "EDGE_KV"
# id = "<namespace id>"

[observability]
enabled = true

# Everything else on autumn-web.app — `/search`, `/api/*`, `/mcp`, `/_stories`,
# `/static/*`, `/health` — is not routed here at all and reaches the origin
# directly. The Worker would fall those through correctly, but a hop that can
# only ever forward is a hop worth not making.
#
# [[routes]]
# pattern = "autumn-web.app/"
# zone_name = "autumn-web.app"
# [[routes]]
# pattern = "autumn-web.app/docs*"
# zone_name = "autumn-web.app"
# [[routes]]
# pattern = "autumn-web.app/robots.txt"
# zone_name = "autumn-web.app"
# [[routes]]
# pattern = "autumn-web.app/sitemap.xml"
# zone_name = "autumn-web.app"
