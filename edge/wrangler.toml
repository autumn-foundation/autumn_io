# Serve the docs read path as static assets from Cloudflare.
#
# Deploying is two steps, in this order:
#
#   cargo run --release --bin build_site    # renders dist/
#   npx wrangler deploy --config edge/wrangler.toml
#
# The render is not a wrangler `[build]` command on purpose: it needs the Rust
# toolchain, and having `wrangler deploy` fail three minutes in with a cargo
# error is worse than being told to run it first.

name = "autumn-io-docs"
compatibility_date = "2026-09-01"

# `dist/` is what `build_site` writes. Everything the CDN needs is in it: the
# rendered pages, `_headers` (the security headers the origin's middleware would
# have added), `_redirects` (the `/docs` 307 the origin's router would have
# served), and `404.html` (the site's own missing-guide page). All four are
# generated by `src/export.rs` and asserted against the origin in
# `tests/static_export.rs`, so none of them can drift into hand-maintenance.
[assets]
directory = "../dist"
not_found_handling = "404-page"

[observability]
enabled = true

# Only the read path is routed here. `/search`, `/api/*`, `/mcp`, `/_stories`
# and `/health` are dynamic and reach the Fly origin directly — there is no
# fallthrough to configure because they are never sent here in the first place.
#
# `/static/*` is in the list and has to be. Every exported page links
# `/static/css/site.css`, which is render-blocking, plus images and scripts.
# Routing the pages here but not their assets would mean a docs visit still
# woke the scale-to-zero origin — and waited on its cold start before the page
# was styled — which is most of what this change exists to avoid.
#
# That works only because the bundle is complete: `export_site` copies this
# repo's `static/` tree *and* writes out the framework-embedded htmx that the
# search box loads and that no `static/` directory contains.
# `no_exported_page_references_a_missing_asset` is what keeps it complete.
#
# ⚠ `/static/*` is BLOCKED on #51 — do not uncomment it as written.
#
# The namespace has two sources: this repo's `static/` tree, which the export
# copies, and assets `autumn-web` serves from memory with no file on disk
# anywhere here (`autumn-widgets.css`, `autumn-widgets.js`, and four more).
# Giving the whole prefix to a bundle containing only the first group turns the
# second into CDN 404s — `/_stories` breaks today, and an autumn-web upgrade can
# add more. #51 has the options; the likely answer is a small fallback Worker so
# an unbundled path proxies to the origin instead of 404ing.
#
# The other four routes are safe to enable on their own.
#
# Commented out until the DNS cutover; until then a `workers.dev` subdomain
# serves the same bundle for checking.
#
# [[routes]]
# pattern = "autumn-web.app/"
# zone_name = "autumn-web.app"
# [[routes]]
# pattern = "autumn-web.app/docs*"
# zone_name = "autumn-web.app"
# [[routes]]
# pattern = "autumn-web.app/static/*"
# zone_name = "autumn-web.app"
# [[routes]]
# pattern = "autumn-web.app/robots.txt"
# zone_name = "autumn-web.app"
# [[routes]]
# pattern = "autumn-web.app/sitemap.xml"
# zone_name = "autumn-web.app"
